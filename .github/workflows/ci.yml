name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'

      - name: Build Docker Image
        run: docker build -t resilient-app .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/resilient-deployment-system
            git pull origin main

            sudo docker stop resilient-container || true
            sudo docker rm resilient-container || true

            sudo docker build -t resilient-app .

            sudo docker run -d \
              -p 80:5000 \
              --name resilient-container \
              resilient-app

      - name: Upload Resilience Report
        uses: actions/upload-artifact@v4
        with:
          name: resilience-report
          path: reports/resilience-report.txt
