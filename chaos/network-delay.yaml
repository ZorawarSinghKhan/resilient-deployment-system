apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-test
  namespace: chaos-testing

spec:
  action: delay
  mode: all

  selector:
    namespaces:
      - default

    labelSelectors:
      app: chaos-app

  delay:
    latency: "3000ms"
    correlation: "100"
    jitter: "0ms"

  duration: "120s"
