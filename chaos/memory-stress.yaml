apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: memory-stress-test
  namespace: chaos-testing

spec:
  mode: one

  selector:
    namespaces:
      - default

    labelSelectors:
      app: chaos-app

  stressors:
    memory:
      workers: 1
      size: 200MB

  duration: "5m"
