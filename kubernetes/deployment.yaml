apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: chaos-app

  template:
    metadata:
      labels:
        app: chaos-app

    spec:
      containers:
      - name: chaos-app
        image: chaos-app
        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
